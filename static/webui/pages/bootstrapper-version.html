<div data-route="/webui/bootstrapper-version" data-title-tag="navbar_bootstrapperVersion">
                <div class="d-none admin-hide">
                    <p data-loc="cheats_administratorRequirement"></p>
                </div>
                <div class="d-none admin-show">
                    <h3 class="mb-2" data-loc="bootstrapperVersion_title"></h3>
                    <p class="text-body-secondary" data-loc="bootstrapperVersion_description"></p>
                    <div class="alert alert-warning" data-loc="bootstrapperVersion_warning"></div>
                    <section class="config-form">
                        <form class="mb-4" onsubmit="doSaveConfigString('tunables.requiredBuildLabel'); return false;">
                            <label class="form-label" for="tunables.requiredBuildLabel" data-loc="bootstrapperVersion_buildLabel"></label>
                            <div class="input-group">
                                <input class="form-control" id="tunables.requiredBuildLabel" type="text" maxlength="16" data-default="" />
                                <button class="btn btn-primary" type="submit" data-loc="bootstrapperVersion_save"></button>
                            </div>
                            <div class="form-text" data-loc="bootstrapperVersion_buildLabelHint"></div>
                        </form>
                        <form class="mb-4" onsubmit="doSaveConfigString('tunables.versionMismatchTitle'); return false;">
                            <label class="form-label" for="tunables.versionMismatchTitle" data-loc="bootstrapperVersion_popupTitle"></label>
                            <div class="input-group">
                                <input class="form-control" id="tunables.versionMismatchTitle" type="text" maxlength="200" data-default="" />
                                <button class="btn btn-primary" type="submit" data-loc="bootstrapperVersion_save"></button>
                            </div>
                        </form>
                        <form onsubmit="doSaveConfigString('tunables.versionMismatchMessage'); return false;">
                            <label class="form-label" for="tunables.versionMismatchMessage" data-loc="bootstrapperVersion_popupMessage"></label>
                            <textarea class="form-control" id="tunables.versionMismatchMessage" rows="5" maxlength="2000" data-default=""></textarea>
                            <div class="form-text" data-loc="bootstrapperVersion_popupMessageHint"></div>
                            <button class="btn btn-primary mt-2" type="submit" data-loc="bootstrapperVersion_save"></button>
                        </form>
                    </section>
                </div>
            </div>
