name: Build Docker image
on:
    push:
        branches:
            - main
        tags:
            - "v*"
    workflow_dispatch:

permissions:
    contents: read
    packages: write

jobs:
    docker:
        if: github.repository == 'Specia1z/SpaceNinjaServer'
        runs-on: ubuntu-latest
        steps:
            - name: Checkout
              uses: actions/checkout@v4
            - name: Set up Docker buildx
              uses: docker/setup-buildx-action@v3
            - name: Log in to GitHub Container Registry
              uses: docker/login-action@v3
              with:
                  registry: ghcr.io
                  username: ${{ github.actor }}
                  password: ${{ secrets.GITHUB_TOKEN }}
            - name: Build and push
              uses: docker/build-push-action@v6
              with:
                  context: .
                  platforms: linux/arm64,linux/amd64
                  push: true
                  tags: |
                      ghcr.io/specia1z/spaceninjaserver:latest
                      ghcr.io/specia1z/spaceninjaserver:${{ github.sha }}
                      ghcr.io/specia1z/spaceninjaserver:${{ github.ref_name }}
                  cache-from: type=gha
                  cache-to: type=gha,mode=max
