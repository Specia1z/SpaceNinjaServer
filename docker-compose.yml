services:
    spaceninjaserver:
        image: ghcr.io/specia1z/spaceninjaserver:latest
        build:
            context: .

        volumes:
            - ./docker-data/conf:/app/conf
            - ./docker-data/static-data:/app/static/data
            - ./docker-data/logs:/app/logs
            - ./.well-known:/app/.well-known
        ports:
            # The lefthand value determines the port you actually connect to. Within the container, SpaceNinjaServer will always use 80 and 443 (righthand values).
            - 80:80
            - 443:443

        # `docker compose up` uses the published GHCR image. Add `--build` to build this checkout locally.

        environment:
            - CHOKIDAR_USEPOLLING=true
        depends_on:
            - mongodb

    mongodb:
        image: docker.io/library/mongo:8.0.0-noble
        volumes:
            - ./docker-data/database:/data/db
        command: mongod --quiet --logpath /dev/null

    warframe-irc-server:
        build:
            context: ./docker/warframe-irc-server
        volumes:
            - ./docker-data/conf:/app/conf
        ports:
            - 6695:6695
            - 6696:6696
            - 6697:6697
            - 6698:6698
            - 6699:6699
            - 6665:6665
            - 6666:6666
            - 6667:6667
            - 6668:6668
            - 6669:6669
        depends_on:
            - spaceninjaserver

    warframe-hub-server:
        image: openwf/warframe-hub-server
        ports:
            - "6952:6952/udp"
        depends_on:
            - spaceninjaserver
