services:
    spaceninjaserver:
        image: ghcr.io/specia1z/spaceninjaserver:latest
        build:
            context: .

        env_file:
            - path: .env
              required: false

        volumes:
            - ./docker-data/conf:/app/conf
            - ./docker-data/static-data:/app/static/data
            - ./docker-data/logs:/app/logs
            - ./.well-known:/app/.well-known
            - ./secrets/playwf-manifest-private.pem:/run/secrets/playwf-manifest-private.pem:ro
        ports:
            # The lefthand value determines the port you actually connect to. Within the container, SpaceNinjaServer will always use 80 and 443 (righthand values).
            - 8800:80
            - 8801:443
            # Built-in TLS IRC service. Keep these aligned with builtinIrcPorts in config.json.
            - "6695-6699:6695-6699/tcp"
            # Optional Hub UDP relay. Remove this mapping when udpRelayPort is disabled.
            - "6953:6953/udp"

        # `docker compose up` uses the published GHCR image. Add `--build` to build this checkout locally.

        environment:
            - CHOKIDAR_USEPOLLING=true
            - TZ=Asia/Shanghai
            # Enable compatible 0.6.x Public Export updates before server modules load.
            # - PUBLIC_EXPORT_AUTO_UPDATE=1
        depends_on:
            - mongodb

    mongodb:
        image: docker.io/library/mongo:8.0.0-noble
        environment:
            - TZ=Asia/Shanghai
        volumes:
            - ./docker-data/database:/data/db
        command: mongod --quiet --logpath /dev/null
